server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /api

spring:
  application:
    name: futmanager-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:futmanager}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:futmanager}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:futmanager}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
      pool-name: FutManagerHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Configurações do FutManager
futmanager:
  default-timezone: ${TIMEZONE:America/Sao_Paulo}
  lesson-horizon-days: ${LESSON_HORIZON_DAYS:30}
  low-frequency-threshold: ${LOW_FREQ_THRESHOLD:75.0}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  security:
    password-reset-token-validity-minutes: ${PASSWORD_RESET_VALIDITY_MINUTES:15}
    email-verification-token-validity-hours: ${EMAIL_VERIFICATION_VALIDITY_HOURS:24}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  auth:
    mode: ${AUTH_MODE:dev} # 'dev' ou 'supabase'
    supabase:
      url: ${SUPABASE_URL:http://localhost:8000}
      jwt-secret: ${SUPABASE_JWT_SECRET:super-secret-jwt-key-for-futmanager-development-must-be-at-least-256-bits-long}
  storage:
    type: ${STORAGE_TYPE:local} # 'supabase' ou 'local'
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
    supabase:
      url: ${SUPABASE_URL:http://localhost:8000}
      anon-key: ${SUPABASE_ANON_KEY:dev-anon-key}
      bucket: ${SUPABASE_STORAGE_BUCKET:student-photos}

# Provedor Transacional de E-mail (Resend)
resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:FutManager <onboarding@resend.dev>}

# Documentação OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
