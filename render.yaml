services:
  # Backend API Spring Boot
  - type: web
    name: futmanager-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api/actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: default
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: AUTH_MODE
        value: dev
      - key: STORAGE_TYPE
        value: local
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      # Configurar no Dashboard do Render:
      # - key: SPRING_DATASOURCE_URL (obtido no Supabase Connection Pooling / Direct URI)
      # - key: SPRING_DATASOURCE_USERNAME (postgres)
      # - key: SPRING_DATASOURCE_PASSWORD (sua senha segura)
