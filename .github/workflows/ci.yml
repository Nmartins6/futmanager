name: FutManager CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-build-test:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: futmanager
          POSTGRES_USER: futmanager
          POSTGRES_PASSWORD: futmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests & Package
        working-directory: ./backend
        run: mvn clean package -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/futmanager?sslmode=disable
          SPRING_DATASOURCE_USERNAME: futmanager
          SPRING_DATASOURCE_PASSWORD: futmanager

  frontend-build:
    name: Frontend Build & Lint (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Compile TypeScript & Build Production Bundle
        working-directory: ./frontend
        run: npm run build
