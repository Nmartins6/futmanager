version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: futmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: futmanager
      POSTGRES_USER: futmanager
      POSTGRES_PASSWORD: futmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futmanager -d futmanager"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: futmanager-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/futmanager?sslmode=disable
      SPRING_DATASOURCE_USERNAME: futmanager
      SPRING_DATASOURCE_PASSWORD: futmanager
      SERVER_PORT: 8080
      TIMEZONE: America/Sao_Paulo
      AUTH_MODE: dev
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: futmanager-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"

volumes:
  postgres-data:
  backend-uploads:
